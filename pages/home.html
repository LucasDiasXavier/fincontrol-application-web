<main>
  <!-- Cabeçalho da página -->
  <div class="fc-page-header">
    <div>
      <h1 class="fc-page-title">Dashboard</h1>
      <p class="fc-page-subtitle">Visão geral das suas finanças</p>
    </div>
  </div>

  <!-- Abas -->
  <input type="radio" name="fc-tabs" id="fc-tab-dashboard" checked />
  <input type="radio" name="fc-tabs" id="fc-tab-resumo" />
  <input type="radio" name="fc-tabs" id="fc-tab-novo" />

  <div class="fc-tab-nav">
    <label for="fc-tab-dashboard">Dashboard</label>
    <label for="fc-tab-resumo">Resumo Financeiro</label>
    <label for="fc-tab-novo">Novo Lançamento</label>
  </div>

  <!-- Painel Dashboard -->
  <div class="fc-tab-panel" id="fc-panel-dashboard">
    <section class="fc-stats">
      <!-- Saldo -->
      <div class="fc-card saldo">
        <div class="fc-card-top">
          <span class="fc-card-label">Saldo atual</span>
          <span class="fc-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="13" rx="2" />
              <path d="M2 10h20" />
              <path d="M6 15h4" />
            </svg>
          </span>
        </div>
        <span class="fc-card-value" id="fc-valor-saldo">R$ 0,00</span>
        <span class="fc-card-note">Atualizado agora</span>
      </div>

      <!-- Receitas -->
      <div class="fc-card receitas">
        <div class="fc-card-top">
          <span class="fc-card-label">Receitas</span>
          <span class="fc-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5" />
              <path d="M5 12l7-7 7 7" />
            </svg>
          </span>
        </div>
        <span class="fc-card-value" id="fc-valor-receitas">R$ 0,00</span>
        <span class="fc-card-note">Este mês</span>
      </div>

      <!-- Despesas -->
      <div class="fc-card despesas">
        <div class="fc-card-top">
          <span class="fc-card-label">Despesas</span>
          <span class="fc-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14" />
              <path d="M19 12l-7 7-7-7" />
            </svg>
          </span>
        </div>
        <span class="fc-card-value" id="fc-valor-despesas">R$ 0,00</span>
        <span class="fc-card-note">Este mês</span>
      </div>
    </section>
  </div>

  <!-- Painel Resumo Financeiro -->
  <div class="fc-tab-panel" id="fc-panel-resumo">
    <section class="fc-section">
      <h2 class="fc-section-title">Resumo financeiro</h2>
      <table class="fc-table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="fc-table-body"></tbody>
      </table>
    </section>
  </div>

  <!-- Painel Novo Lançamento -->
  <div class="fc-tab-panel" id="fc-panel-novo">
    <section class="fc-section">
      <h2 class="fc-section-title">Novo lançamento</h2>
      <form>
        <div class="fc-field">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Conta de luz" />
        </div>
        <div class="fc-field">
          <label for="valor">Valor</label>
          <input type="number" id="valor" placeholder="R$ 0,00" />
        </div>
        <div class="fc-type-toggle">
          <input type="radio" name="tipo" id="fc-tipo-receita" />
          <label for="fc-tipo-receita">Receita</label>
          <input type="radio" name="tipo" id="fc-tipo-despesa" />
          <label for="fc-tipo-despesa">Despesa</label>
        </div>
        <div class="fc-modal-actions">
          <button type="submit" class="fc-btn-primary">Salvar</button>
          <button type="reset" class="fc-btn-secondary">Cancelar</button>
        </div>
      </form>
    </section>
  </div>
</main>

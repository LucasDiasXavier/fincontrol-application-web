<main>
  <!-- Cabeçalho da página -->
  <div class="fc-page-header">
    <div>
      <h1 class="fc-page-title">Dashboard</h1>
      <p class="fc-page-subtitle">Visão geral das suas finanças</p>
    </div>
  </div>

  <!-- Abas -->
  <input type="radio" name="fc-tabs" id="fc-tab-dashboard" checked />
  <input type="radio" name="fc-tabs" id="fc-tab-resumo" />
  <input type="radio" name="fc-tabs" id="fc-tab-novo" />

  <div class="fc-tab-nav">
    <label for="fc-tab-dashboard"
      >Dashboard
      <i class="fa-solid fa-chart-line"></i>
    </label>
    <label for="fc-tab-resumo"
      >Resumo Financeiro
      <i class="fa-solid fa-coins"></i>
    </label>

    <label for="fc-tab-novo"
      >Novo Lançamento
      <i class="fa-solid fa-money-bill-transfer"></i>
    </label>
  </div>

  <!-- Painel Dashboard -->
  <div class="fc-tab-panel" id="fc-panel-dashboard">
    <section class="fc-stats">
      <!-- Saldo -->
      <div class="fc-card saldo">
        <div class="fc-card-top">
          <span class="fc-card-label">Saldo atual</span>
          <span class="fc-card-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="6" width="20" height="13" rx="2" />
              <path d="M2 10h20" />
              <path d="M6 15h4" />
            </svg>
          </span>
        </div>
        <span class="fc-card-value" id="fc-valor-saldo">R$ 0,00</span>
        <span class="fc-card-note">Atualizado agora</span>
      </div>

      <!-- Receitas -->
      <div class="fc-card receitas">
        <div class="fc-card-top">
          <span class="fc-card-label">Receitas</span>
          <span class="fc-card-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 6V18" />
              <path d="M6 12H18" />
            </svg>
          </span>
        </div>
        <span class="fc-card-value" id="fc-valor-receitas">R$ 0,00</span>
        <span class="fc-card-note">Este mês</span>
      </div>

      <!-- Despesas -->
      <div class="fc-card despesas">
        <div class="fc-card-top">
          <span class="fc-card-label">Despesas</span>
          <span class="fc-card-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12H19" />
            </svg>
          </span>
        </div>
        <span class="fc-card-value" id="fc-valor-despesas">R$ 0,00</span>
        <span class="fc-card-note">Este mês</span>
      </div>
    </section>

    <div class="fc-card" style="margin-top: 16px">

    <div class="fc-grafico-header">

        <div>
            <h2 class="fc-section-title">
                Receitas x Despesas
            </h2>

            <p class="fc-card-note">
                Visão mensal
            </p>
        </div>


        <select
            id="fc-ano-grafico"
            class="fc-year-select"
        >
        </select>

    </div>


    <div style="position: relative; height: 340px">

        <canvas id="fc-grafico-mensal"></canvas>

    </div>
  </div>

  </div>
  <!-- Painel Resumo Financeiro -->
  <div class="fc-tab-panel" id="fc-panel-resumo">
    <section class="fc-section">
      <h2 class="fc-section-title">Resumo financeiro</h2>
      <table class="fc-table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="fc-table-body"></tbody>
      </table>
    </section>
  </div>

  <!-- Painel Novo Lançamento -->
  <div class="fc-tab-panel" id="fc-panel-novo">
    <section class="fc-section">
      <h2 class="fc-section-title">Novo lançamento</h2>
      <form id="fc-form">
        <div class="fc-field">
          <label for="descricao">Descrição</label>
          <select id="descricao">
            <option value="Conta de água">Conta de água</option>
            <option value="Conta de luz">Conta de luz</option>
            <option value="Conta de internet">Conta de internet</option>
            <option value="Cofrinho">Cofrinho</option>
            <option value="outros">Outros</option>
          </select>
          <input
            type="text"
            id="descricao-outros"
            class="fc-desc-outros-input"
            placeholder="Digite a descrição"
          />
        </div>

        <div class="fc-field">
          <label for="valor">Valor</label>
          <input
            type="number"
            id="valor"
            step="0.01"
            min="0.01"
            inputmode="decimal"
            placeholder="R$ 0,00"
          />
        </div>

        <div class="fc-form-group"></div>
        <label class="fc-type-title">Selecione o tipo de transação</label>
        <div class="fc-type-toggle">
          <input type="radio" name="tipo" id="fc-tipo-receita" />
          <label for="fc-tipo-receita">
            <svg
              class="fc-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 6V18" />
              <path d="M6 12H18" />
            </svg>
            Receita
          </label>
          <input type="radio" name="tipo" id="fc-tipo-despesa" />
          <label for="fc-tipo-despesa">
            <svg
              class="fc-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12H19" />
            </svg>
            Despesa
          </label>
        </div>

        <div class="fc-modal-actions">
          <button type="submit" class="fc-btn-primary">Salvar</button>
          <button type="reset" class="fc-btn-secondary">Cancelar</button>
        </div>
      </form>
    </section>
  </div>
</main>
